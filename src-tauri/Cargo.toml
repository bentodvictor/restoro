[package]
name = "restoro"
version = "0.1.0"
description = "Minimal desktop Pomodoro stopwatch"
authors = ["Victor D Bento"]
edition = "2021"

[lib]
name = "restoro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
